<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style-login.css">
    <link rel="shortcut icon" href="img/Logo-Circular-Chapa-Quente.ico" type="image/x-icon">
    
</head>

<body>
    <div class="boxzinho">
        <img src="img/Ícone de Usuário Neon em Vidro.png" alt="">
    <h1>Login</h1>
    <p class="topo">Entre na sua conta para continuar</p>


<div class="email">
        <img src="img/Ícone de Envelope Branco Minimalista.png" alt="">
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
   
</div>

<p id="erroEmail"></p>

<div class="CPF">
            
            <img src="img/Ícone_de_usuário_branco_brilhante-removebg-preview.png" alt="">
            <input type="text" name="Cpf" id="cpf" placeholder="Digite seu CPF" maxlength="14" inputmode="numeric" autocomplete="off">
        </div>
        <p id="errocpf"></p>

        <div class="senha">
            <img src="img/Ícone de Cadeado Branco Minimalista.png" alt="">
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
        <button type="button" id="mostrar" class="mostrarsenha"></button>

</div>
        <p id="erroSenha"></p>

        <button type="button" id="login">Entrar</button>

    

    <p>
        Ainda não possui uma conta?
        <a href="index.html">Cadastre-se</a>
    </p>
    
</div>
</body>
</html>

<script>

let CPFbonitinho = document.getElementById("cpf");

        CPFbonitinho.addEventListener("input", function(){
           let numeros = CPFbonitinho.value.replace(/\D/g, "");
           numeros = numeros.substring(0, 11);
           
           if (numeros.length > 9) {
        numeros = numeros.replace(
            /^(\d{3})(\d{3})(\d{3})(\d{1,2}).*/,
            "$1.$2.$3-$4"
        );
    } else if (numeros.length > 6) {
        numeros = numeros.replace(
            /^(\d{3})(\d{3})(\d{1,3}).*/,
            "$1.$2.$3"
        );
    } else if (numeros.length > 3) {
        numeros = numeros.replace(
            /^(\d{3})(\d{1,3}).*/,
            "$1.$2"
        );
    }
        CPFbonitinho.value = numeros;
        })


let mostrar = document.getElementById("mostrar");
    let senhaOculta = document.getElementById("senha");
    let confirmarOculta = document.getElementById("confirmar-senha");
    let mostrar2 = document.getElementById("mostrar2");
    
    let ocultar1 = 0;
    let ocultar2 = 0;

    mostrar.addEventListener("click", function(){
        if(ocultar1 === 1){
            mostrar.style.backgroundImage = "url('img/Ícone de olho oculto minimalista.png')";
            senhaOculta.type = "password";
            ocultar1 = 0;
        } else {
            mostrar.style.backgroundImage = "url('img/Ícone de Olho Branco Minimalista.png')";
            senhaOculta.type = "text";
            ocultar1 = 1;
        }
    });

    function validarCPF(strCPF) {
        strCPF = strCPF.replace(/[^\d]+/g, '');
        if (strCPF.length !== 11 || /^(\d)\1+$/.test(strCPF)) return false;
        
        let Soma = 0;
        let Resto;

        for (let i = 1; i <= 9; i++) {
            Soma = Soma + parseInt(strCPF.substring(i - 1, i)) * (11 - i);
        }
        Resto = (Soma * 10) % 11;
        if ((Resto === 10) || (Resto === 11)) Resto = 0;
        if (Resto !== parseInt(strCPF.substring(9, 10))) return false;

        Soma = 0;
        for (let i = 1; i <= 10; i++) {
            Soma = Soma + parseInt(strCPF.substring(i - 1, i)) * (12 - i);
        }
        Resto = (Soma * 10) % 11;
        if ((Resto === 10) || (Resto === 11)) Resto = 0;
        if (Resto !== parseInt(strCPF.substring(10, 11))) return false;

        return true;
    }

      function validarEmail(email) {
    const regex = /^[^\s@]+@gmail\.com$/;
    const regex2 = /^[^\s@]+@hotmail\.com$/;
    const regex3 = /^[^\s@]+@yahoo\.com$/;
    const regex4 = /^[^\s@]+@outlook\.com$/;
    const regex5 = /^[^\s@]+@icloud\.com$/;
    const regex6 = /^[^\s@]+@proton\.me$/;
    
        if (regex.test(email) || regex2.test(email) || regex3.test(email) || regex4.test(email) || regex5.test(email) || regex6.test(email)) {
            return true;
        } else {
            return false;
        }
    return regex.test(email);
}



    let botao = document.getElementById("login");
    botao.addEventListener("click", function(event){
        event.preventDefault();

        let cpf = document.getElementById("cpf").value;
        
        let senha = document.getElementById("senha").value;
        let email = document.getElementById("email").value;
        
        
        let erroSenha = document.getElementById("erroSenha");
        let erroEmail = document.getElementById("erroEmail");
        let erroCpf = document.getElementById("errocpf");

        
        if (!validarCPF(cpf)) {
            erroCpf.textContent = "Seu CPF não está correto ou é inválido.";
            erroCpf.style.color = "white";
        } else {
            erroCpf.textContent = "";
        }

        
        if (senha.length < 8) {
            erroSenha.textContent = "A senha tem que ter no mínimo 8 caracteres.";
            erroSenha.style.color = "white";
        } else {
            erroSenha.textContent = "";
        }

        if (email.regex === "" || !validarEmail(email)) {
            erroEmail.textContent = "O e-mail tem que ser válido.";
            erroEmail.style.color = "white";
        } else {
            erroEmail.textContent = "";
        }



        
        if (erroCpf.textContent === "" && erroSenha.textContent === "" && erroEmail.textContent === "") {
            let dados = {
                CPF: cpf,
                Senha: senha,
                Email: email
            };
            let texto = JSON.stringify(dados);
            alert("Cadastro realizado com sucesso!\n" + texto);
        }
    });
</script>
